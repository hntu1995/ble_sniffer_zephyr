# nRF52840 SuperMini BLE sniffer
#
# The board (promicro_nrf52840) already enables the new USB device stack and
# a CDC-ACM UART (board_cdc_acm_uart) by default. Keep that enabled and use it
# as the binary packet pipe.

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_ENABLE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="nRF52840 BLE Sniffer"
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="Zephyr"
CONFIG_CDC_ACM_SERIAL_VID=0x2FE3
CONFIG_CDC_ACM_SERIAL_PID=0x0008
CONFIG_UART_LINE_CTRL=y

CONFIG_SERIAL=y
CONFIG_GPIO=y
CONFIG_CLOCK_CONTROL=y

# Logs go to UART0 (P0.09 TX / P0.10 RX, 115200) so the CDC port carries only
# binary frames. The app.overlay moves the console there.
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=n

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ASSERT=y
